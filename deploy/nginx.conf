server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and adds security headers. Compressing here too keeps
    # local runs representative; Traefik leaves already-encoded responses alone.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;
    absolute_redirect off;
    port_in_redirect off;

    # Content-Security-Policy. A location with its own add_header drops these
    # server-level ones, so `location /` (the prerendered HTML) repeats them;
    # the 404 page and the redirects inherit them from here.
    # Enforced: only directives nothing on the site depends on;
    # frame-ancestors 'none' matches the X-Frame-Options: DENY Traefik sets.
    # Report-Only: the full policy, enforced once the console shows no
    # violations. style-src 'unsafe-inline' is the <style> block in the
    # prerendered HTML; /cdn-cgi/ scripts (Cloudflare email decode) are 'self'.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Old routes from the previous site.
    location = /about    { return 301 /#about; }
    location = /contact  { return 301 /#about; }
    location = /projects { return 301 /#products; }

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is prerendered HTML or an unhashed public file: revalidate.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html =404;
    }

    location = /Daniel_Van_Eijck_CV.pdf {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Disposition 'inline; filename="Daniel_Van_Eijck_CV.pdf"';
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
