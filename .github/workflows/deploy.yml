name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/portfolio

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  update-deploy-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - id: version
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/portfolio_deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy

      - name: Update image tag
        run: |
          cd deploy
          TAG="${{ steps.version.outputs.tag }}"
          sed -i "s|\${WEB_TAG:-[^}]*}|\${WEB_TAG:-${TAG}}|g" docker-compose.yml
          echo "Updated WEB_TAG -> ${TAG}"

      - name: Commit and push
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git diff --cached --quiet || git commit -m "Deploy ${{ steps.version.outputs.tag }}"
          git push

  deploy-to-server:
    needs: update-deploy-repo
    runs-on: ubuntu-latest
    steps:
      # Join the tailnet as an ephemeral tag:ci node. The tailnet policy lets
      # tag:ci reach tag:server on tcp:22 and nothing else.
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.103.91.20
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: 100.103.91.20 # trippy's tailnet IP
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          # The host key is pinned, not accepted on first use.
          echo 'trippy ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII32dHVtZEO/8BRrdh1JYwzfuAiS87b92W/fF21/Am1Z' > ~/.ssh/known_hosts
          # This key has no shell: it is pinned on the server to the forced
          # command /usr/local/bin/trippy-deploy, which runs the portfolio
          # deploy (git pull, compose pull, up -d) and refuses anything else.
          ssh -i ~/.ssh/id_deploy \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=trippy \
              "$SERVER_USER@$SERVER_HOST" \
              portfolio
