name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/portfolio

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - id: version
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      # Join the tailnet as an ephemeral tag:ci node. The tailnet policy lets
      # tag:ci reach tag:server on tcp:22 and nothing else.
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.103.91.20
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: 100.103.91.20 # trippy's tailnet IP
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          # The host key is pinned, not accepted on first use.
          echo 'trippy ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII32dHVtZEO/8BRrdh1JYwzfuAiS87b92W/fF21/Am1Z' > ~/.ssh/known_hosts
          # This key has no shell: it is pinned on the server to the forced
          # command /usr/local/bin/trippy-deploy, which checks the tag, pins it
          # in the server-local .env, then pulls and restarts portfolio, and
          # refuses anything else. CI has no write access to portfolio_deploy:
          # whoever can push there is root on trippy.
          ssh -i ~/.ssh/id_deploy \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=trippy \
              "$SERVER_USER@$SERVER_HOST" \
              "portfolio $TAG --all"
